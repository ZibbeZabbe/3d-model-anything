# Mutation testing runs from this folder (npm run test:python:mutation): the scripts are
# top-level modules, not a package, so mutmut must see them by their bare names.
[mutmut]
paths_to_mutate =
    bundle_to_room.py
    house_to_rooms.py
    prepare_photos.py
tests_dir = .
# Test helpers and golden files the tests read, copied next to the mutated modules.
also_copy =
    synthetic_bundle.py
    testdata

[tool:pytest]
addopts = -p no:dash
norecursedirs = mutants
